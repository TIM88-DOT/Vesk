    <!--
      Structured data. The page is a client-rendered SPA, so crawlers that do not execute JS

      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Vesk",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Appointment scheduling and customer messaging",
        "operatingSystem": "Web",
        "url": "https://www.getvesk.app/",
        "description": "Communication platform for appointment-based businesses. Sends bilingual (French/English) SMS appointment reminders, classifies inbound replies with an AI agent, and auto-confirms, cancels or reschedules when confidence is high enough, escalating to staff when it is not.",
        "inLanguage": ["en", "fr"],
        "audience": {
          "@type": "Audience",
          "audienceType": "Salons, clinics, spas, barbershops, dental practices and studios"
        },

          "Automatic appointment confirmation, cancellation and reschedule links",
          "Escalation to staff when classifier confidence is low",
          "Automated review recovery with Google and Facebook links",
          "30-day review request cooldown enforced outside the model",
          "Consent gate checked before every outbound message",
          "Business hours and quiet hours enforcement",
          "Public booking pages with per-tenant URL slugs",
          "Appointment ingestion via webhook and CSV import",
          "Customer history and no-show risk scoring",
          "Real-time dashboard with delivery rates and agent run logs",
          "Message templates with per-language variants",
          "GDPR consent tracking and one-click PII anonymization",

  <body>
    <div id="root"></div>

    <!--
      Static fallback for crawlers and clients without JavaScript. Mirrors the rendered page so the
      product is legible without executing the bundle.
    -->
    <noscript>
      <main>
        <h1>Vesk, bilingual SMS reminders and reply AI for appointment businesses</h1>
        <p>
          Vesk sends French and English appointment reminders over SMS, reads what customers
          text back, and acts on it, confirming, cancelling or sending a reschedule link when it
          is confident, and handing the conversation to staff when it is not. Built for salons,
          clinics, spas, barbershops, dental practices and studios.
        </p>

        <h2>How the AI is governed</h2>
        <p>
          The model classifies intent; it never holds the authority to act on one. Consent, the
          30-day review cooldown and business-hours checks are enforced in application code before
          any message is sent, and appointment status transitions are validated by the domain
          layer. Classification runs against a committed 40-case bilingual evaluation set, where
          failures are graded by blast radius rather than raw accuracy.
        </p>

        <h2>Features</h2>
        <ul>
          <li>Bilingual (FR/EN) SMS appointment reminders, timed per customer</li>
          <li>AI reply classification with confidence scoring and staff escalation</li>
          <li>Automatic confirmation, cancellation and reschedule links</li>
          <li>Review recovery with Google and Facebook links, on a 30-day cooldown</li>
          <li>Public booking pages with per-business URL slugs</li>
          <li>Real-time dashboard: delivery rates, no-show trends, agent run logs</li>
          <li>Message templates with per-language variants</li>
        </ul>

        <h2>Integrations</h2>
        <ul>
          <li>Twilio for SMS delivery and inbound webhooks</li>
          <li>Appointment ingestion from an existing booking system via webhook</li>
          <li>CSV import for migrating an existing customer list</li>
          <li>Google and Facebook review destinations</li>
          <li>Public booking API for unauthenticated bookings</li>
          <li>Azure OpenAI as the classification model provider</li>
        </ul>

        <h2>Data protection and tenancy</h2>
        <ul>
          <li>GDPR consent tracking with recorded consent source</li>
          <li>One-click PII anonymization; records are soft-deleted, never hard-deleted</li>
          <li>Immutable audit log of appointment status changes</li>
          <li>Per-tenant data isolation asserted on every continuous integration run</li>
          <li>Idempotent inbound SMS and webhook handling</li>
        </ul>

        <h2>Contact</h2>
        <p>
          Email <a href="mailto:hello@getvesk.app">hello@getvesk.app</a> to arrange a demo or ask
          anything about the product.
        </p>

        <h2>Availability</h2>
        <p>
          Vesk is pre-launch. Pricing is not published yet and billing is not switched on, get
          in touch and we will set you up directly. The product has no customers yet, so this
          page carries no testimonials, logos or usage claims.
        </p>
      </main>
    </noscript>
